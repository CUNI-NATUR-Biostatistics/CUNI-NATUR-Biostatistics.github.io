name: Deploy lesson Pages
description: >-
  Deploy an uploaded Pages artifact with a build version that is unique to this
  workflow run, attempt and phase. actions/deploy-pages always uses GITHUB_SHA,
  so a release deployed shortly after a preview of the same commit could be
  reported as successful while GitHub Pages kept serving the earlier build.

inputs:
  artifact-id:
    description: Artifact ID returned by actions/upload-pages-artifact.
    required: true
  phase:
    description: Short label that keeps the initial deployment and a retry distinct.
    required: true
  timeout-seconds:
    description: Maximum time to wait for the deployment to finish.
    required: false
    default: "600"

outputs:
  page_url:
    description: Public GitHub Pages URL reported for the deployment.
    value: ${{ steps.deploy.outputs.page_url }}
  build_version:
    description: Unique Pages build version used for this deployment.
    value: ${{ steps.deploy.outputs.build_version }}

runs:
  using: composite
  steps:
    - name: Create and await Pages deployment
      id: deploy
      uses: actions/github-script@v7
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        DEPLOY_PHASE: ${{ inputs.phase }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const artifactId = Number(process.env.ARTIFACT_ID);
          if (!Number.isInteger(artifactId) || artifactId <= 0) {
            core.setFailed(`Invalid artifact ID: ${process.env.ARTIFACT_ID}`);
            return;
          }

          const buildVersion = [
            context.sha,
            process.env.GITHUB_RUN_ID,
            process.env.GITHUB_RUN_ATTEMPT,
            process.env.DEPLOY_PHASE
          ].join("-");

          const oidcToken = await core.getIDToken();
          const { data: deployment } = await github.request(
            "POST /repos/{owner}/{repo}/pages/deployments",
            {
              owner,
              repo,
              artifact_id: artifactId,
              pages_build_version: buildVersion,
              oidc_token: oidcToken
            }
          );

          const deploymentId =
            deployment.id ?? deployment.status_url?.split("/").pop();
          core.info(
            `Created Pages deployment ${deploymentId} for build version ${buildVersion}`
          );
          core.setOutput("build_version", buildVersion);
          core.setOutput("page_url", deployment.page_url ?? "");

          const finalErrors = new Set([
            "deployment_failed",
            "deployment_perms_error",
            "deployment_content_failed",
            "deployment_cancelled",
            "deployment_lost"
          ]);
          const deadline =
            Date.now() + Number(process.env.TIMEOUT_SECONDS || "600") * 1000;

          while (true) {
            await new Promise((resolve) => setTimeout(resolve, 5000));

            let status = "unknown_status";
            try {
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}",
                { owner, repo, pages_deployment_id: deploymentId }
              );
              status = data.status;
            } catch (error) {
              core.warning(`Could not read deployment status: ${error.message}`);
            }

            if (status === "succeed") {
              core.info("Pages deployment succeeded.");
              return;
            }
            if (finalErrors.has(status)) {
              core.setFailed(`Pages deployment ended with status: ${status}`);
              return;
            }
            if (Date.now() > deadline) {
              core.setFailed(
                `Pages deployment did not finish in time (last status: ${status}).`
              );
              return;
            }
            core.info(`Current status: ${status}`);
          }
