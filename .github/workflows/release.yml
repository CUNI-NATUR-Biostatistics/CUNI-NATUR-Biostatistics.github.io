name: Release materials and publish lesson Pages

on:
  workflow_call:
    secrets:
      HUB_APP_ID:
        required: false
      HUB_APP_PRIVATE_KEY:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      lesson: ${{ steps.website.outputs.lesson }}
      academic_year: ${{ steps.website.outputs.academic_year }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format and detect Moodle mode
        id: tag_meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REGEX='^L[0-9]{2}-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}(-moodle)?$'

          if [[ ! "$TAG" =~ $REGEX ]]; then
            echo "ERROR: Invalid tag format: $TAG"
            echo "Expected: LWW-vMAJOR.MINOR.PATCH-YYYYMMDD[-moodle]"
            exit 1
          fi

          if [[ "$TAG" =~ -moodle$ ]]; then
            echo "moodle_mode=true" >> "$GITHUB_OUTPUT"
          else
            echo "moodle_mode=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package public website materials
        id: website
        uses: CUNI-NATUR-Biostatistics/CUNI-NATUR-Biostatistics.github.io/.github/actions/package-website-release@main
        with:
          tag: ${{ github.ref_name }}

      - name: Create Moodle ZIP
        id: moodle
        if: steps.tag_meta.outputs.moodle_mode == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/moodle
          ruby -ryaml -rfileutils -e '
            manifest = YAML.safe_load_file("website-release.yml", aliases: false)
            resources = manifest.fetch("resources")
            required = %w[learning presentation].flat_map do |group|
              resources.fetch(group).values_at("html", "pdf")
            end
            required.each do |path|
              abort("ERROR: Missing required file: #{path}") unless File.file?(path)
              destination = File.join("dist", "moodle", path)
              FileUtils.mkdir_p(File.dirname(destination))
              FileUtils.cp(path, destination)
            end
          '
          ZIP_NAME="materialy-${GITHUB_REF_NAME}.zip"
          (cd dist/moodle && zip -q -r "../${ZIP_NAME}" .)
          echo "asset_path=dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.tag_meta.outputs.moodle_mode != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.website.outputs.asset_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Create release with Moodle bundle
        if: steps.tag_meta.outputs.moodle_mode == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.website.outputs.asset_path }}
            ${{ steps.moodle.outputs.asset_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Lesson Pages are published by the lesson's own preview workflow.
  #
  # A release tag usually points at a commit that "Publish preview" already
  # deployed after the merge to main. actions/deploy-pages identifies a Pages
  # deployment by the commit SHA, so deploying that SHA again from this
  # workflow silently reuses the earlier deployment and the release build never
  # goes live. Dispatching preview.yml after the GitHub Release exists instead
  # produces a fresh deployment whose assembled site already selects the newest
  # release as current/. The preview workflow keeps its own deployment check.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      current_tag: ${{ steps.current.outputs.current_tag }}

    steps:
      - name: Dispatch the lesson preview workflow on main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started=${started}" >> "$GITHUB_OUTPUT"
          gh workflow run preview.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched preview.yml on main at ${started}."

      - name: Wait for the dispatched Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        shell: bash
        run: |
          set -euo pipefail

          # Newest preview run on main created after the dispatch. A later push
          # to main can supersede a pending dispatched run in the shared
          # lesson-pages concurrency group; the newer run assembles the same
          # releases, so it is followed instead.
          latest_run() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow preview.yml \
              --branch main --limit 20 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"${STARTED}\")] | sort_by(.createdAt) | last | .databaseId // empty"
          }

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(latest_run)"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "ERROR: No preview run on main appeared after the dispatch at ${STARTED}."
            exit 1
          fi

          for round in 1 2 3; do
            echo "Following preview run ${run_id}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15 > /dev/null; then
              echo "Preview run ${run_id} published lesson Pages."
              exit 0
            fi
            conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
            newer="$(latest_run)"
            if [ "$conclusion" = "cancelled" ] && [ -n "$newer" ] && [ "$newer" != "$run_id" ]; then
              echo "Preview run ${run_id} was superseded by run ${newer}."
              run_id="$newer"
              continue
            fi
            echo "ERROR: Preview run ${run_id} finished with conclusion '${conclusion}'."
            exit 1
          done
          echo "ERROR: Preview runs kept being superseded; check the lesson Pages manually."
          exit 1

      - name: Read the current release from lesson Pages
        id: current
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/current/manifest.json?verify_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          current_tag="$(curl --fail --silent --show-error --location "$url" | ruby -rjson -e 'puts JSON.parse($stdin.read).fetch("tag")')"
          echo "Lesson Pages current/ serves ${current_tag}."
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"

  notify-hub:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HUB_APP_CONFIGURED: ${{ secrets.HUB_APP_ID != '' && secrets.HUB_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Create hub installation token
        id: app-token
        if: env.HUB_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HUB_APP_ID }}
          private-key: ${{ secrets.HUB_APP_PRIVATE_KEY }}
          owner: CUNI-NATUR-Biostatistics
          repositories: CUNI-NATUR-Biostatistics.github.io

      - name: Request immediate hub refresh
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LESSON: ${{ needs.release.outputs.lesson }}
          ACADEMIC_YEAR: ${{ needs.release.outputs.academic_year }}
          RELEASE_TAG: ${{ needs.publish.outputs.current_tag }}
        shell: bash
        run: |
          gh api --method POST \
            repos/CUNI-NATUR-Biostatistics/CUNI-NATUR-Biostatistics.github.io/dispatches \
            -f event_type=lesson-released \
            -F "client_payload[lesson]=${LESSON}" \
            -F "client_payload[academic_year]=${ACADEMIC_YEAR}" \
            -F "client_payload[tag]=${RELEASE_TAG}"

      - name: Explain optional dispatch configuration
        if: steps.app-token.outcome == 'skipped'
        run: echo "Hub notification skipped because GitHub App secrets are not configured."
