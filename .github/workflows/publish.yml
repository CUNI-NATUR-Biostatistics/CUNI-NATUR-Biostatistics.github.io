name: Publish course hub

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - lesson-released

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out hub source
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install hub dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Synchronize public release catalog
        env:
          EXPECTED_LESSON: ${{ github.event.client_payload.lesson }}
          EXPECTED_ACADEMIC_YEAR: ${{ github.event.client_payload.academic_year }}
          EXPECTED_RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: Rscript R/sync_catalog.R

      - name: Render Quarto website
        run: Rscript R/render_site.R

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
